services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hhvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hhvc_staging}
      POSTGRES_DB: ${POSTGRES_DB:-hhvc_staging}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hhvc} -d ${POSTGRES_DB:-hhvc_staging}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/dnikulshinwork/hh-vacancy-collector/api}:${IMAGE_TAG:-staging}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # /metrics api доступен только с loopback хоста (без basic-auth снаружи не достать),
    # но smoke-тесты/CI (`scripts/smoke-test.sh http://localhost:3001`) продолжают работать.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: staging
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hhvc}:${POSTGRES_PASSWORD:-hhvc_staging}@postgres:5432/${POSTGRES_DB:-hhvc_staging}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/dnikulshinwork/hh-vacancy-collector/worker}:${IMAGE_TAG:-staging}
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    # /metrics worker — только с loopback (см. комментарий у сервиса api выше).
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-hhvc}:${POSTGRES_PASSWORD:-hhvc_staging}@postgres:5432/${POSTGRES_DB:-hhvc_staging}
      REDIS_URL: redis://redis:6379
      SCRAPER_HEADLESS: "true"
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-1}
      SCRAPER_BASE_URL: ${SCRAPER_BASE_URL:-https://hh.ru}
      SCRAPER_PROXY: ${SCRAPER_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3002/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: ${WEB_IMAGE:-ghcr.io/dnikulshinwork/hh-vacancy-collector/web}:${IMAGE_TAG:-staging}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: staging
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/htpasswd:/etc/nginx/htpasswd:ro
      - certbot_staging_etc:/etc/letsencrypt
      - certbot_staging_www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      # upstream'ы worker/grafana резолвятся при старте nginx: без этих
      # зависимостей — «host not found in upstream» на первом `up`.
      # healthcheck'ов у worker/grafana нет → service_started.
      worker:
        condition: service_started
      grafana:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_staging_data:/prometheus
    depends_on:
      - api
      - worker
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ../monitoring/alertmanager:/etc/alertmanager/templates:ro
      - alertmanager_staging_data:/alertmanager
    # Секреты подставляются в шаблон из env при старте: значений в git нет.
    # Пустые значения — внятная ошибка вместо молча неработающего alertmanager.
    # Спецсимволы sed (`\`, `&`, `|`) в значениях экранируются функцией escape_sed.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "$${TELEGRAM_CHAT_ID:-}" ]; then
          echo "error: TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID обязательны для Alertmanager (см. docs/monitoring.md §6)" >&2
          exit 1
        fi
        escape_sed() { printf '%s' "$$1" | sed -e 's/[\\&|]/\\&/g'; }
        token="$$(escape_sed "$$TELEGRAM_BOT_TOKEN")"
        chat="$$(escape_sed "$$TELEGRAM_CHAT_ID")"
        sed -e "s|__TELEGRAM_BOT_TOKEN__|$$token|g" \
            -e "s|__TELEGRAM_CHAT_ID__|$$chat|g" \
            /etc/alertmanager/templates/alertmanager.yml.tmpl > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager

  # Grafana наружу не публикуется: доступ только через nginx (/grafana/).
  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_staging_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata_staging:
  redisdata_staging:
  certbot_staging_etc:
  certbot_staging_www:
  prometheus_staging_data:
  alertmanager_staging_data:
  grafana_staging_data:
