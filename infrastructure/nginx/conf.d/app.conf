upstream api_upstream {
    server api:3001;
    keepalive 32;
}

upstream worker_upstream {
    server worker:3002;
    keepalive 32;
}

upstream grafana_upstream {
    server grafana:3000;
    keepalive 32;
}

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20M;

    # ACME-challenge for Let's Encrypt SSL certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API endpoints proxy
    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Метрики API за basic-auth (Sprint 5). Креды — из env, файл .htpasswd
    # генерируется scripts/gen-htpasswd.sh и в git не попадает.
    location = /metrics {
        auth_basic "hhvc metrics";
        auth_basic_user_file /etc/nginx/htpasswd/metrics;

        proxy_pass http://api_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Метрики worker за basic-auth: /metrics/worker -> worker:3002/metrics
    location = /metrics/worker {
        auth_basic "hhvc metrics";
        auth_basic_user_file /etc/nginx/htpasswd/metrics;

        proxy_pass http://worker_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Grafana за nginx (сам сервис порт наружу не публикует).
    # /grafana без слэша не матчится location /grafana/ и ушёл бы в web — редиректим.
    location = /grafana {
        return 301 /grafana/;
    }

    # proxy_pass БЕЗ trailing slash: Grafana запущена с GF_SERVER_SERVE_FROM_SUB_PATH=true
    # и ожидает путь с префиксом /grafana/* — префикс не срезаем.
    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js static assets with long cache
    location /_next/static/ {
        proxy_pass http://web_upstream/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Web UI proxy
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
