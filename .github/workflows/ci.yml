name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hhvc
          POSTGRES_PASSWORD: hhvc
          POSTGRES_DB: hhvc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hhvc -d hhvc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db generate

      - name: Lint / Typecheck / Unit / Build
        run: pnpm turbo run lint typecheck test:unit build
        env:
          DATABASE_URL: postgresql://hhvc:hhvc@localhost:5432/hhvc
          REDIS_URL: redis://localhost:6379

      - name: Push Database Schema
        run: pnpm --filter @repo/db db:push
        env:
          DATABASE_URL: postgresql://hhvc:hhvc@localhost:5432/hhvc

      - name: E2E (api + worker)
        run: pnpm turbo run test:e2e
        env:
          DATABASE_URL: postgresql://hhvc:hhvc@localhost:5432/hhvc
          REDIS_URL: redis://localhost:6379

  build-and-push:
    name: Build & Push GHCR Images
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased repo owner
        id: slug
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.slug.outputs.owner }}/hh-vacancy-collector/api:latest
            ghcr.io/${{ steps.slug.outputs.owner }}/hh-vacancy-collector/api:${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.slug.outputs.owner }}/hh-vacancy-collector/worker:latest
            ghcr.io/${{ steps.slug.outputs.owner }}/hh-vacancy-collector/worker:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.slug.outputs.owner }}/hh-vacancy-collector/web:latest
            ghcr.io/${{ steps.slug.outputs.owner }}/hh-vacancy-collector/web:${{ github.sha }}